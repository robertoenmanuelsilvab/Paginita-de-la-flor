<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spider Lily</title>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background:
            radial-gradient(circle at 50% 75%, #29152f 0%, #110b19 45%, #05050a 100%);
        font-family: Georgia, serif;
        cursor: crosshair;
        color: white;
    }

    canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
    }

    .title {
        position: fixed;
        top: 28px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 2;
        pointer-events: none;
        text-shadow: 0 0 20px #ffd43b;
    }

    .title h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 58px);
        letter-spacing: 8px;
        font-weight: normal;
    }

    .title p {
        margin: 8px 0;
        opacity: .7;
        letter-spacing: 3px;
        font-size: 12px;
    }

    .hint {
        position: fixed;
        bottom: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        padding: 10px 18px;
        border: 1px solid rgba(255,210,80,.25);
        border-radius: 30px;
        background: rgba(20,8,25,.45);
        backdrop-filter: blur(8px);
        color: #ffeaa0;
        font-size: 12px;
        letter-spacing: 1px;
        pointer-events: none;
    }
</style>
</head>

<body>
<canvas id="flower"></canvas>

<div class="title">
    <h1>Pa ti enana cDy</h1>
    <p>quiza no sea real pero wtv esta ta linda tmbien</p>
</div>

<div class="hint">✦ puedes hacer q se mueva y darle click jijija</div>

<script>
const canvas = document.getElementById("flower");
const ctx = canvas.getContext("2d");

let W, H, dpr;
let mouse = { x: 0, y: 0, active: false };
let bloom = 0;
let targetBloom = 0;
let petals = [];
let particles = [];

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth;
    H = innerHeight;

    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    createFlower();
}

function createFlower() {
    petals = [];

    
    const count = 14;

    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i;

        petals.push({
            angle,
            length: 125 + Math.random() * 65,
            width: 5 + Math.random() * 3,
            curve: (Math.random() - .5) * .9,
            phase: Math.random() * Math.PI * 2
        });
    }
}

function flowerCenter() {
    return {
        x: W / 2,
        y: H * .57
    };
}

function drawBackground(t) {
    const c = flowerCenter();

 
    const glow = ctx.createRadialGradient(
        c.x, c.y, 0,
        c.x, c.y, Math.min(W, H) * .55
    );

    glow.addColorStop(0, "rgba(255,205,50,.12)");
    glow.addColorStop(.45, "rgba(180,120,20,.035)");
    glow.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, H);

    
    for (const p of particles) {
        p.y -= p.speed;
        p.x += Math.sin(t * .001 + p.phase) * .15;

        if (p.y < -10) {
            p.y = H + 10;
            p.x = Math.random() * W;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, ${100 + p.glow}, ${170 + p.glow / 2}, ${p.alpha})`;
        ctx.shadowBlur = 12;
        ctx.shadowColor = "#ffd43b";
        ctx.fill();
    }

    ctx.shadowBlur = 0;
}

function createParticles() {
    particles = [];

    for (let i = 0; i < 80; i++) {
        particles.push({
            x: Math.random() * W,
            y: Math.random() * H,
            size: .5 + Math.random() * 1.8,
            speed: .08 + Math.random() * .3,
            alpha: .15 + Math.random() * .5,
            glow: Math.random() * 80,
            phase: Math.random() * Math.PI * 2
        });
    }
}

function drawStem(c, t) {
    const sway = Math.sin(t * .0011) * 7;
    const mouseInfluence =
        mouse.active ? (mouse.x - c.x) / W * 25 : 0;

    ctx.beginPath();
    ctx.moveTo(c.x, c.y + 15);
    ctx.bezierCurveTo(
        c.x + sway + mouseInfluence * .2, c.y + 120,
        c.x - 12 + sway + mouseInfluence * .5, H - 130,
        c.x + sway + mouseInfluence, H + 20
    );

    ctx.lineWidth = 5;
    ctx.strokeStyle = "#183d2c";
    ctx.shadowBlur = 10;
    ctx.shadowColor = "#38a66b";
    ctx.stroke();
    ctx.shadowBlur = 0;

   
    for (let side of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(c.x + sway, H - 100);
        ctx.quadraticCurveTo(
            c.x + side * 100,
            H - 145,
            c.x + side * 170,
            H - 85
        );
        ctx.quadraticCurveTo(
            c.x + side * 80,
            H - 125,
            c.x + sway,
            H - 100
        );

        const leaf = ctx.createLinearGradient(
            c.x, H - 100,
            c.x + side * 150, H - 100
        );

        leaf.addColorStop(0, "#1d5b3c");
        leaf.addColorStop(1, "#071c16");

        ctx.fillStyle = leaf;
        ctx.fill();
    }
}

function drawPetal(c, petal, index, t) {
    const sway =
        Math.sin(t * .0015 + petal.phase) * .07;

    let angle = petal.angle + sway;

    
    if (mouse.active) {
        const dx = mouse.x - c.x;
        const dy = mouse.y - c.y;
        const mouseAngle = Math.atan2(dy, dx);
        let difference = Math.atan2(
            Math.sin(mouseAngle - angle),
            Math.cos(mouseAngle - angle)
        );

        angle += difference * .08;
    }

    const open = .75 + bloom * .35;
    const len = petal.length * open;

    const tipX = c.x + Math.cos(angle) * len;
    const tipY = c.y + Math.sin(angle) * len;

    const curveAmount =
        Math.sin(t * .001 + petal.phase) * 16 +
        petal.curve * 45;

    const normalX = -Math.sin(angle);
    const normalY = Math.cos(angle);

    const cp1x = c.x + Math.cos(angle) * len * .28 +
                 normalX * curveAmount;
    const cp1y = c.y + Math.sin(angle) * len * .28 +
                 normalY * curveAmount;

    const cp2x = c.x + Math.cos(angle) * len * .72 +
                 normalX * curveAmount * 1.5;
    const cp2y = c.y + Math.sin(angle) * len * .72 +
                 normalY * curveAmount * 1.5;

    const width = petal.width * (1 + bloom * .3);

    ctx.beginPath();

    ctx.moveTo(c.x, c.y);

    ctx.bezierCurveTo(
        cp1x + normalX * width,
        cp1y + normalY * width,
        cp2x + normalX * width,
        cp2y + normalY * width,
        tipX,
        tipY
    );

    ctx.bezierCurveTo(
        cp2x - normalX * width,
        cp2y - normalY * width,
        cp1x - normalX * width,
        cp1y - normalY * width,
        c.x,
        c.y
    );

    const gradient = ctx.createLinearGradient(
        c.x, c.y, tipX, tipY
    );

    gradient.addColorStop(0, "#fff3a1");
    gradient.addColorStop(.25, "#ffd43b");
    gradient.addColorStop(.72, "#e9a915");
    gradient.addColorStop(1, "#a66a08");

    ctx.fillStyle = gradient;
    ctx.shadowBlur = 18;
    ctx.shadowColor = "#ffd21f";
    ctx.fill();
    ctx.shadowBlur = 0;

   
    ctx.beginPath();
    ctx.moveTo(c.x, c.y);
    ctx.quadraticCurveTo(
        cp2x, cp2y,
        tipX, tipY
    );

    ctx.strokeStyle = "rgba(255,245,190,.8)";
    ctx.lineWidth = .8;
    ctx.stroke();

    
    const filamentAngle =
        angle + Math.sin(index * 4.3) * .18;

    const fx = c.x + Math.cos(filamentAngle) * len * 1.18;
    const fy = c.y + Math.sin(filamentAngle) * len * 1.18;

    ctx.beginPath();
    ctx.moveTo(
        c.x + Math.cos(angle) * 15,
        c.y + Math.sin(angle) * 15
    );

    ctx.quadraticCurveTo(
        c.x + Math.cos(angle) * len * .65 + normalX * 15,
        c.y + Math.sin(angle) * len * .65 + normalY * 15,
        fx,
        fy
    );

    ctx.strokeStyle = "rgba(255,225,120,.9)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(fx, fy, 2, 0, Math.PI * 2);
    ctx.fillStyle = "#ffd2e7";
    ctx.shadowBlur = 12;
    ctx.shadowColor = "#ffe06b";
    ctx.fill();
    ctx.shadowBlur = 0;
}

function drawFlower(t) {
    const c = flowerCenter();

    drawStem(c, t);

   
    petals.forEach((p, i) => {
        drawPetal(c, p, i, t);
    });

    
    const centerGlow = ctx.createRadialGradient(
        c.x, c.y, 0,
        c.x, c.y, 30
    );

    centerGlow.addColorStop(0, "#fff2a6");
    centerGlow.addColorStop(.3, "#ffd35c");
    centerGlow.addColorStop(1, "rgba(255,150,40,0)");

    ctx.beginPath();
    ctx.arc(c.x, c.y, 30, 0, Math.PI * 2);
    ctx.fillStyle = centerGlow;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(c.x, c.y, 5 + bloom * 3, 0, Math.PI * 2);
    ctx.fillStyle = "#ffd86a";
    ctx.shadowBlur = 18;
    ctx.shadowColor = "#ffd34e";
    ctx.fill();
    ctx.shadowBlur = 0;
}

function animate(t) {
    ctx.clearRect(0, 0, W, H);

    bloom += (targetBloom - bloom) * .045;

    drawBackground(t);
    drawFlower(t);

    requestAnimationFrame(animate);
}

canvas.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;

    const c = flowerCenter();
    const distance = Math.hypot(mouse.x - c.x, mouse.y - c.y);

    targetBloom = Math.max(
        .15,
        1 - distance / Math.min(W, H)
    );
});

canvas.addEventListener("mouseleave", () => {
    mouse.active = false;
    targetBloom = .25;
});

canvas.addEventListener("click", () => {
    targetBloom = 1;

    
    const c = flowerCenter();

    for (let i = 0; i < 22; i++) {
        particles.push({
            x: c.x,
            y: c.y,
            size: 1 + Math.random() * 2,
            speed: 1 + Math.random() * 2,
            alpha: .8,
            glow: 100,
            phase: Math.random() * Math.PI * 2
        });
    }

    setTimeout(() => targetBloom = .45, 900);
});

window.addEventListener("resize", () => {
    resize();
    createParticles();
});

resize();
createParticles();
requestAnimationFrame(animate);
</script>
</body>
</html>
